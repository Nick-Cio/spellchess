<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spellchess</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
:root{
  --bg:#ecebe8; --panel:#f7f6f4; --ink:#1c1b1a; --muted:#6d6a66; --line:#d3d0cb;
  --lt:#d9d9d9; --dk:#7f7b78; --coord:#8a8784;
  --sel:rgba(255,214,0,.55); --last:rgba(120,180,255,.35);
  --jump:#2f9e4e; --rage:#d23a2a; --speed:#f2c531; --earth:#7a4f2b;
  --sq:calc(min(100vh - 186px, 56vw) / 8);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1b1a19; --panel:#242321; --ink:#ecebe8; --muted:#a19d98; --line:#3a3835; }
}
:root[data-theme="dark"]{ --bg:#1b1a19; --panel:#242321; --ink:#ecebe8; --muted:#a19d98; --line:#3a3835; }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14px;padding:12px 16px 12px;overflow:hidden;display:flex;flex-direction:column}
h1{font-family:Sora,sans-serif;font-weight:700;font-size:22px;margin:0;letter-spacing:-.01em}
.top{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-bottom:10px}
.top .sub{color:var(--muted)}
.wrap{display:flex;gap:22px;align-items:flex-start;flex:1;min-height:0}
.boardcol{display:flex;flex-direction:column;gap:6px;flex:none}
.board{display:grid;grid-template-columns:repeat(8,var(--sq));grid-template-rows:repeat(8,var(--sq));border:1px solid #5c5955;user-select:none}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:default}
.sq.lt{background:var(--lt)} .sq.dk{background:var(--dk)}
.sq.last{box-shadow:inset 0 0 0 100px var(--last)}
.sq.sel{box-shadow:inset 0 0 0 100px var(--sel)}
.sq.tgt{cursor:pointer}
.sq .coord{position:absolute;font-family:Sora,sans-serif;font-weight:600;font-size:calc(var(--sq)*.2);color:var(--coord);pointer-events:none}
.sq .coord.r{top:2px;left:4px} .sq .coord.f{bottom:1px;right:4px}
.sq .pc{font-size:calc(var(--sq)*.92);line-height:1;pointer-events:none;font-family:"Apple Symbols","Segoe UI Symbol","DejaVu Sans","Noto Sans Symbols 2",sans-serif;position:relative;z-index:2}
.sq .pc.w{color:#fff;-webkit-text-stroke:calc(var(--sq)*.03) #111;paint-order:stroke fill;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.sq .pc.b{color:#111}
.sq .dot{position:absolute;width:calc(var(--sq)*.3);height:calc(var(--sq)*.3);border-radius:50%;background:var(--dot,rgba(0,0,0,.28));opacity:.8;pointer-events:none}
.sq .ring{position:absolute;inset:0;border:calc(var(--sq)*.09) solid var(--dot,rgba(0,0,0,.28));border-radius:50%;opacity:.8;pointer-events:none}
.board{transition:box-shadow .25s}
.board.arm{box-shadow:0 0 0 2px var(--spell),0 0 28px rgba(0,0,0,.0),0 0 26px var(--spell)}
.sq.cand{cursor:pointer}
.sq.cand::after{content:"";position:absolute;inset:0;z-index:0;background:var(--spell);opacity:.14;pointer-events:none;transition:opacity .15s}
.sq.cand:hover::after,.sq.cand.hov::after{opacity:.55}
.sq.cand:hover .pc{filter:drop-shadow(0 0 8px var(--spell)) drop-shadow(0 0 2px var(--spell))}
.sq .prev{position:absolute;width:calc(var(--sq)*.28);height:calc(var(--sq)*.28);border-radius:50%;background:var(--spell);opacity:.7;pointer-events:none;z-index:2}
.sq .prevcap{position:absolute;inset:6%;border:calc(var(--sq)*.07) solid var(--spell);border-radius:50%;opacity:.75;pointer-events:none;z-index:2}
.sq .rock.ghost{opacity:.4}
.sq .rock.encase{opacity:.78;z-index:3}
.sq .pc.encased{filter:grayscale(.6) brightness(.85)}
.sq .flashring{position:absolute;inset:0;border:3px solid var(--spell);border-radius:6px;animation:flash .6s ease-out forwards;pointer-events:none;z-index:3}
@keyframes flash{0%{transform:scale(1);opacity:1}100%{transform:scale(1.7);opacity:0}}
.board.pulse{animation:pulse .7s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--spell)}100%{box-shadow:0 0 0 18px transparent}}
.sq.phased .pc{filter:drop-shadow(0 0 7px var(--jump)) drop-shadow(0 0 2px var(--jump))}
.sq.raged .pc{filter:drop-shadow(0 0 7px var(--rage)) drop-shadow(0 0 2px var(--rage))}
.sq.speed .pc{filter:drop-shadow(0 0 7px var(--speed)) drop-shadow(0 0 2px var(--speed))}
.sq.phased::before{content:"";position:absolute;inset:0;background:rgba(47,158,78,.32)}
.sq.raged::before{content:"";position:absolute;inset:0;background:rgba(210,58,42,.4)}
.sq.speed::before{content:"";position:absolute;inset:0;background:rgba(242,197,49,.5)}
.sq .rock{position:absolute;inset:6%;z-index:2;pointer-events:none}
.sq .rock svg{width:100%;height:100%;shape-rendering:crispEdges;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.sq .rock .dust{position:absolute;left:50%;bottom:8%;width:calc(var(--sq)*.09);height:calc(var(--sq)*.09);border-radius:50%;background:#4d301a;opacity:0}
.sq .rock.rise .dust{animation:dust .55s ease-out forwards}
.sq .rock.rise .dust:nth-child(2){--dx:-1.4} .sq .rock.rise .dust:nth-child(3){--dx:-.6} .sq .rock.rise .dust:nth-child(4){--dx:.6} .sq .rock.rise .dust:nth-child(5){--dx:1.4}
@keyframes dust{0%{opacity:0;transform:translate(-50%,0) scale(.6)}25%{opacity:.9}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0)*var(--sq)*.32),calc(var(--sq)*-.28)) scale(1.2)}}
.sq.infected::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 55%, rgba(0,0,0,.55), rgba(0,0,0,0) 70%);animation:veil 2.4s ease-in-out infinite;animation-delay:var(--ph,0ms);pointer-events:none}
.sq.infected .pc{animation:throb 2.4s ease-in-out infinite;animation-delay:var(--ph,0ms)}
.sq.infected .pc.w{-webkit-text-stroke:calc(var(--sq)*.03) #000}
@keyframes throb{0%,100%{filter:drop-shadow(0 0 2px #000) drop-shadow(0 0 4px #000)}50%{filter:drop-shadow(0 0 6px #000) drop-shadow(0 0 14px #000)}}
@keyframes veil{0%,100%{opacity:.5}50%{opacity:1}}
.sq.flipanim .pc{animation:flip .9s ease-in-out;animation-delay:var(--t0,0ms)}
@keyframes flip{0%{transform:scaleX(1)}35%{transform:scaleX(0) translateY(-6%);filter:drop-shadow(0 0 12px #000)}60%{transform:scaleX(1.15) translateY(-6%);filter:drop-shadow(0 0 16px #000)}100%{transform:scaleX(1)}}
.sq .flashring.dark{border-color:#000;border-width:5px;animation-duration:.9s}
@media (prefers-reduced-motion: reduce){ .sq.infected::before,.sq.infected .pc,.sq.flipanim .pc{animation:none} }
.card.playable[data-type=parasite],.card[data-type=parasite]{box-shadow:inset 0 0 0 1px #3a3a3a}
.promo{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:45;display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);padding:12px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.promo button{width:72px;height:72px;font-size:56px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;background:var(--lt)}
.promo .pc{font-family:"Apple Symbols","Segoe UI Symbol","DejaVu Sans","Noto Sans Symbols 2",sans-serif}
.promo .pc.w{color:#fff;-webkit-text-stroke:2px #111;paint-order:stroke fill}
.promo .pc.b{color:#111}
.sq .infdots{position:absolute;top:4%;left:50%;transform:translateX(-50%);display:flex;gap:3px;z-index:3;pointer-events:none}
.sq .infdots span{width:calc(var(--sq)*.12);height:calc(var(--sq)*.12);border-radius:50%;background:#000;border:1px solid #fff}
#endfx{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);animation:endin .5s ease-out}
#endfx .endbox{background:var(--panel);color:var(--ink);border:2px solid var(--ink);padding:36px 48px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:endpop .6s cubic-bezier(.2,.9,.3,1.3)}
#endfx .endtitle{font-family:Sora,sans-serif;font-weight:700;font-size:clamp(36px,8vmin,72px);letter-spacing:.12em;text-transform:uppercase;line-height:1}
#endfx .endtitle.mate{color:var(--rage);text-shadow:0 0 24px var(--rage)}
#endfx .endsub{font-family:Sora,sans-serif;font-weight:600;font-size:20px;margin:14px 0 22px;color:var(--muted)}
@keyframes endin{from{opacity:0}to{opacity:1}}
@keyframes endpop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
#castfx{position:fixed;inset:0;z-index:40;pointer-events:none;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px}
#castfx .fxwash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%, var(--spell) 0%, transparent 62%);animation:fxwash 1.1s ease-out forwards}
#castfx .fxicon{width:min(46vmin,300px);height:min(46vmin,300px);animation:fxicon 1.1s cubic-bezier(.2,.8,.2,1) forwards;filter:drop-shadow(0 0 24px var(--spell))}
#castfx .fxicon svg{width:100%;height:100%;shape-rendering:crispEdges}
#castfx .fxname{font-family:Sora,sans-serif;font-weight:700;font-size:clamp(28px,6vmin,48px);letter-spacing:.18em;text-transform:uppercase;color:#fff;text-shadow:0 0 18px var(--spell),0 2px 0 #000;animation:fxname 1.1s ease-out forwards}
@keyframes fxwash{0%{opacity:0}15%{opacity:.85}70%{opacity:.6}100%{opacity:0}}
@keyframes fxicon{0%{transform:scale(.4);opacity:0}20%{transform:scale(1.08);opacity:1}75%{transform:scale(1);opacity:1}100%{transform:scale(1.15);opacity:0}}
@keyframes fxname{0%{transform:translateY(16px);opacity:0}25%{transform:translateY(0);opacity:1}75%{opacity:1}100%{opacity:0}}
.sq .streak{position:absolute;inset:0;background:var(--speed);opacity:0;animation:streak .6s ease-out forwards;pointer-events:none;z-index:1}
@keyframes streak{0%{opacity:0}20%{opacity:.85}100%{opacity:0}}
.sq.raged .pc{animation:ragethrob 1.2s ease-in-out infinite}
@keyframes ragethrob{0%,100%{filter:drop-shadow(0 0 4px var(--rage)) drop-shadow(0 0 2px var(--rage))}50%{filter:drop-shadow(0 0 12px var(--rage)) drop-shadow(0 0 4px var(--rage));transform:scale(1.06)}}
.sq.phased .pc{animation:phase 1.4s ease-in-out infinite}
@keyframes phase{0%,100%{opacity:1;filter:drop-shadow(0 0 4px var(--jump))}50%{opacity:.45;filter:drop-shadow(0 0 14px var(--jump))}}
.sq .rock.rise svg{animation:rockrise .5s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes rockrise{0%{clip-path:inset(100% 0 0 0);transform:translateY(18%)}70%{clip-path:inset(0 0 0 0);transform:translateY(-4%)}100%{clip-path:inset(0 0 0 0);transform:translateY(0)}}
.sq.quake{animation:quake .4s ease-out}
@keyframes quake{0%,100%{transform:translate(0,0)}20%{transform:translate(-2px,1px)}40%{transform:translate(2px,-1px)}60%{transform:translate(-1px,-1px)}80%{transform:translate(1px,1px)}}
@media (prefers-reduced-motion: reduce){ #castfx{display:none} .sq.raged .pc,.sq.phased .pc,.sq .rock.rise svg,.sq .rock.rise .dust,.sq.quake{animation:none} }
.sq .kingcap{position:absolute;inset:0;border:4px solid var(--rage);pointer-events:none}

.status{font-family:Sora,sans-serif;font-weight:600;font-size:16px}
.status .who{display:inline-block;width:12px;height:12px;border:1px solid #333;border-radius:50%;vertical-align:-1px;margin-right:6px}
.status .who.w{background:#fff} .status .who.b{background:#111}
.hint{color:var(--muted)}
.hint.warn{color:var(--rage);font-weight:600}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.clockrow{display:flex;justify-content:space-between;align-items:center;min-height:30px;gap:10px}
.pbar{display:flex;align-items:center;gap:10px;min-height:26px}
#barBot{margin-left:auto}
.caps{display:flex;align-items:center;gap:1px;font-family:"Apple Symbols","Segoe UI Symbol","DejaVu Sans","Noto Sans Symbols 2",sans-serif;font-size:19px;line-height:1}
.caps .g{display:inline-block}
.caps .g.w{color:#fff;-webkit-text-stroke:.8px #111;paint-order:stroke fill}
.caps .g.b{color:#111;-webkit-text-stroke:.6px #777;paint-order:stroke fill}
.caps .g+.g.gap{margin-left:5px}
.matplus{font-family:Sora,sans-serif;font-weight:700;font-size:13px;color:var(--muted)}
.minicards{display:flex;align-items:center}
.minicards i{display:block;width:12px;height:17px;border:1.5px solid #000;border-radius:2px;background:repeating-linear-gradient(45deg,#3a3734 0 3px,#55514c 3px 6px);margin-left:-5px;box-shadow:0 0 0 1px var(--panel)}
.minicards i:first-child{margin-left:0}
.minicards .n{font-family:Sora,sans-serif;font-weight:700;font-size:12px;color:var(--muted);margin-left:6px}
.clock{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:20px;font-weight:600;padding:2px 12px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:4px;min-width:96px;text-align:center}
.clock.run{color:var(--ink);border-color:var(--ink);background:var(--bg)}
.clock.low{color:var(--rage);border-color:var(--rage)}
.clock.low.run{animation:clockblink 1s steps(2,start) infinite}
@keyframes clockblink{to{opacity:.55}}
#clkBot{margin-left:auto}
button{font:inherit;font-weight:500;padding:6px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;cursor:pointer}
button:hover{border-color:var(--ink)} button:focus-visible{outline:2px solid var(--speed);outline-offset:2px}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.side{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:min-content;gap:12px;flex:1;min-width:0;max-height:100%;overflow:auto}
.side .wide{grid-column:1/-1}
#handBlock{grid-column:1/-1}
#settingsBlock,#onlineBlock{position:fixed;top:52px;right:16px;z-index:30;width:300px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.pill{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:999px}
.pill.on{background:var(--jump);color:#fff;border-color:var(--jump)}
.pill+.gear{margin-left:0}
.online-row{display:flex;gap:8px;align-items:center;margin-top:8px}
.online-row input{flex:1;font:inherit;padding:6px 8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-transform:uppercase;letter-spacing:.1em}
.code{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;letter-spacing:.2em;margin:6px 0}
.online-note{color:var(--muted);font-size:12px;margin-top:6px}
.online-note.warn{color:var(--rage)}
.gear{margin-left:auto;font-size:20px;line-height:1;padding:4px 8px;border-color:transparent;background:transparent}
.gear:hover{border-color:var(--line)}
.block{background:var(--panel);border:1px solid var(--line);padding:10px 12px}
.block h2{font-family:Sora,sans-serif;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between}
.block h2 .n{color:var(--ink)}
.cards{display:flex;gap:10px;flex-wrap:wrap;min-height:40px}
.card{position:relative;width:96px;height:134px;border:2px solid #000;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 6px 8px;font-family:Sora,sans-serif;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.05em;cursor:default}
.card .art{width:64px;height:64px;margin-top:8px}
.card .art svg{width:100%;height:100%;shape-rendering:crispEdges;image-rendering:pixelated}
.card.sm{width:60px;height:84px;font-size:9px;padding:6px 4px 5px}
.card.sm .art{width:36px;height:36px;margin-top:3px}
.card.back{background:repeating-linear-gradient(45deg,#2a2826 0 6px,#3a3734 6px 12px);color:#8a8784;justify-content:center;align-items:center;font-size:26px}
.card.playable{cursor:pointer;transition:transform .12s}
.card.playable:hover{transform:translateY(-4px)}
.card.armed{outline:3px solid #fff;outline-offset:-6px;transform:translateY(-6px)}
.card.dim{opacity:.45}
#tip{position:fixed;background:var(--ink);color:var(--bg);font:500 12px/1.3 "IBM Plex Sans",sans-serif;padding:6px 10px;border-radius:4px;z-index:50;pointer-events:none;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px))}
.track{display:flex;gap:18px;flex-wrap:wrap}
.stack{position:relative;width:60px;height:calc(84px + 2*26px)}
.stack .card{position:absolute;left:0;transition:opacity .2s}
.stack .card.gone{opacity:.4;filter:grayscale(1) brightness(.7)}
.stack .cnt{position:absolute;right:-6px;top:-6px;background:var(--ink);color:var(--bg);font:700 11px Sora,sans-serif;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:5}
.discgroup{display:flex;flex-direction:column;gap:6px;min-width:120px;padding-right:14px;border-right:1px solid var(--line)}
.discgroup:last-child{border-right:0;padding-right:0}
.disclabel{font-family:Sora,sans-serif;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#discard{display:flex;gap:14px;flex-wrap:wrap}
.deckrow{display:flex;gap:16px;align-items:center;color:var(--muted)}
.deckrow b{color:var(--ink);font-family:"IBM Plex Mono",monospace}
.log{font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.5;max-height:120px;overflow:auto;color:var(--muted);white-space:pre-wrap}
.log .me{color:var(--ink)}
.settings{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;font-size:12px}
.settings input[type=number]{width:56px;font:inherit;padding:3px 6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.settings label{color:var(--muted)}
.rules{font-size:12px;line-height:1.45;color:var(--muted)}
.rules b{color:var(--ink)}
@media (max-width:900px){ body{overflow:auto;height:auto} html,body{height:auto} .wrap{flex-wrap:wrap} :root{--sq:calc(min(92vw,100vh - 200px)/8)} .side{max-height:none;overflow:visible;width:100%} }
@media (prefers-reduced-motion: reduce){ .card{transition:none} }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
</head>
<body>

<div class="top"><h1>Spellchess</h1><div class="status" id="status"></div><div class="hint" id="hint"></div><button id="onlineBtn" class="pill">Play online</button><button id="gear" class="gear" title="Settings" aria-label="Settings">&#9881;</button></div>
<div class="block" id="onlineBlock" hidden><h2>Online game</h2><div id="onlineBody"></div></div>
<div class="wrap">
  <div class="boardcol">
    <div class="clockrow"><div class="pbar" id="barTop"></div><div class="clock" id="clkTop" hidden></div></div>
    <div class="board" id="board"></div>
    <div class="btns">
      <div class="pbar" id="barBot"></div><div class="clock" id="clkBot" hidden></div>
      <button id="undo">Undo</button>
      <button id="resign">Resign</button>
      <button id="newgame" class="primary">New game</button>
    </div>
  </div>
  <div class="side">
    <div class="block" id="handBlock"><h2><span id="handTitle">Hand</span><span class="n" id="handN"></span></h2><div class="cards" id="hand"></div></div>
    <div class="block"><h2><span>Revealed from deck</span><span class="n" id="revN"></span></h2><div class="cards" id="revealed"></div>
      <div class="deckrow" style="margin-top:10px"><span>Deck <b id="deckN"></b></span><span>Next reveal in <b id="nextRev"></b> moves</span></div></div>
    <div class="block"><h2><span>Discard</span><span class="n" id="discN"></span></h2><div class="cards" id="discard" style="min-height:0"></div></div>
    <div class="block wide"><h2><span id="trackTitle">Opponent could hold</span><span class="n" id="trackN"></span></h2><div class="track" id="track"></div></div>
    <div class="block" id="settingsBlock" hidden><h2>Settings</h2>
      <div class="settings">
        <label for="sHand">Cards dealt to each player</label><input id="sHand" type="number" min="0" max="6" value="3">
        <label for="sInit">Revealed at start</label><input id="sInit" type="number" min="0" max="12" value="2">
        <label for="sEvery">Reveal one every N full moves</label><input id="sEvery" type="number" min="1" max="20" value="4">
        <label for="sClock">Play with clock</label><input id="sClock" type="checkbox" checked>
        <label for="sMin">Minutes per side</label><input id="sMin" type="number" min="1" max="180" value="5">
        <label for="sInc">Increment (seconds)</label><input id="sInc" type="number" min="0" max="60" value="3">
        <label for="sFlip">Flip board for Black</label><input id="sFlip" type="checkbox">
      </div>

function newGame(){

function log(s,me){S.log.push({s,me:!!me});}
function snapshot(){history.push(JSON.stringify(S)); if(history.length>200) history.shift();}

/* ---------- move generation ---------- */
function view(S){return sq=>sq===S.phased?null:S.board[sq];}
function inb(f,r){return f>=0&&f<8&&r>=0&&r<8;}
function gen(S,from,atk){ const noCastle=!!atk;

    const d=c==='w'?1:-1, start=c==='w'?1:6, last=c==='w'?7:0;
    const one=(r+d)*8+f;
    if(inb(f,r+d) && one!==S.phased && !v(one)){ push(one,{promo:r+d===last});
      const two=(r+2*d)*8+f; if(r===start && two!==S.phased && !v(two)) push(two,{dbl:true}); }
    else if(inb(f,r+d) && one===S.phased){ const two=(r+2*d)*8+f; if(r===start && !v(two)) push(two,{dbl:true}); }
    for(const df of [-1,1]){ if(!inb(f+df,r+d)) continue; const to=(r+d)*8+f+df; const q=v(to);
      if(to!==S.phased && q && q.c!==c && q.c!=='x' && (q.t!=='k'||atk)) push(to,{promo:r+d===last});
      else if(to===S.ep && !q) push(to,{ep:true}); }
  } else if(t==='n'){
    for(const [df,dr] of [[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]]) if(inb(f+df,r+dr)){const to=(r+dr)*8+f+df; if(landable(to)) push(to);}
  } else if(t==='b') slide(BISH); else if(t==='r') slide(ROOK); else if(t==='q') slide(ROOK.concat(BISH));
  else if(t==='k'){
    for(const [df,dr] of ROOK.concat(BISH)) if(inb(f+df,r+dr)){const to=(r+dr)*8+f+df; if(landable(to)) push(to);}
    if(!noCastle && p.t==='k'){
      const home=c==='w'?0:56; if(from===home+4 && !attacked(S,from,other(c))){
        const empty=sq=>!v(sq)&&sq!==S.phased;
        if(S.castling[c].k && empty(home+5)&&empty(home+6) && v(home+7)&&v(home+7).t==='r'&&v(home+7).c===c && !attacked(S,home+5,other(c))) push(home+6,{castle:'k'});
        if(S.castling[c].q && empty(home+3)&&empty(home+2)&&empty(home+1) && v(home)&&v(home).t==='r'&&v(home).c===c && !attacked(S,home+3,other(c))) push(home+2,{castle:'q'});

}
function attacked(S,sq,by){

}
function infOf(sq){ const r=(S.infected||{})[sq]; if(!r) return null; return typeof r==='string'?{by:r,left:3}:r; }
function kingSq(S,c){ for(let i=0;i<64;i++){const p=S.board[i]; if(p&&p.c===c&&p.t==='k') return i;} return -1; }
function applyMove(S,m,opt){
  const b=S.board, p=b[m.from]; const inf=S.infected||(S.infected={});
  let capSq=m.to; if(m.ep) capSq=m.to+(p.c==='w'?-8:8);

  if(cap && cap.c!=='x'){ S.captured=S.captured||{w:[],b:[]}; S.captured[p.c]=S.captured[p.c]||[]; S.captured[p.c].push(cap.t); }

function safeAfter(T){ const k=kingSq(T,T.turn); return k<0 || !attacked(T,k,other(T.turn)); }
function legal(S,from){
  const p=view(S)(from); if(!p||p.c!==S.turn) return [];
  const speedFirst=S.spell&&S.spell.type==='speed'&&S.spell.stage===0;
  const speedSecond=S.spell&&S.spell.type==='speed'&&S.spell.stage===1;
  const noCap=m=>!(view(S)(m.to)||m.ep);
  return gen(S,from).filter(m=>{
    if(speedSecond && !noCap(m)) return false;
    const T=JSON.parse(JSON.stringify(S)); applyMove(T,m,{noFlip:true});
    if(safeAfter(T)) return true;
    // Speed: the first move may pass through check if some second move of the same piece ends safely
    if(speedFirst && !T.flipped){
      return gen(T,m.to).some(m2=>{ if(view(T)(m2.to)||m2.ep) return false; const T2=JSON.parse(JSON.stringify(T)); applyMove(T2,m2,{noFlip:true}); return safeAfter(T2); });
    }
    return false;
  });
}
function allLegal(S){ const out=[]; for(let i=0;i<64;i++){const p=S.board[i]; if(p&&p.c===S.turn&&i!==S.phased) out.push(...legal(S,i));} return out; }
function inCheck(S){ const k=kingSq(S,S.turn); return k>=0 && attacked(S,k,other(S.turn)); }

/* ---------- turn flow ---------- */
function clockNow(){ return Date.now()+(window.__serverOffset||0); }
function endTurn(){
  if(S.clock&&S.clock.on&&S.clock.running&&S.clock.lastTick){ const t=clockNow(); S.clock[S.clock.running]=Math.max(0,S.clock[S.clock.running]-(t-S.clock.lastTick))+S.clock.inc; S.clock.lastTick=t; }

  S.turn=other(S.turn);
  if(S.clock&&S.clock.on){ S.clock.running=S.turn; if(!S.clock.lastTick) S.clock.lastTick=clockNow(); }

  S.rocks=S.rocks.filter(rk=>{ if(rk.owner===S.turn){ const cell=S.board[rk.sq]; S.board[rk.sq]=(cell&&cell.under)?cell.under:null; return false;} return true; });

  for(const k of Object.keys(S.infected||{})){ const r=S.infected[k]; const rec=typeof r==='string'?{by:r,left:3}:r; if(rec.by===S.turn){ rec.left--; if(rec.left<=0) delete S.infected[k]; else S.infected[k]=rec; } }

}
function evaluateTurnStart(){
  S.needEval=false;
  const moves=allLegal(S);
  if(!moves.length){
    if(!S.hands[S.turn].length){ if(inCheck(S)){ S.over={winner:other(S.turn),reason:'checkmate'}; log(`Checkmate. ${NAMES[other(S.turn)]} wins.`,true);} else { S.over={winner:null,reason:'stalemate'}; log('Stalemate.',true);} }
    else if(inCheck(S)){ if(spellCanEscape()) S.notice='In check with no moves. A spell is your only way out.'; else { S.over={winner:other(S.turn),reason:'checkmate'}; log(`Checkmate. ${NAMES[other(S.turn)]} wins.`,true); } }

function spellCanEscape(){
  const types=[...new Set(S.hands[S.turn])];

  for(const t of types){
    if(t==='speed'){ const T=JSON.parse(base); T.spell={type:'speed',stage:0}; if(ok(T)) return true; }
    if(t==='rage'){ for(let i=0;i<64;i++){ const p=S.board[i]; if(p&&p.c===S.turn&&p.t!=='p'){ const T=JSON.parse(base); T.raged=i; if(ok(T)) return true; } } }
    if(t==='jump'){ for(let i=0;i<64;i++){ const p=S.board[i]; if(p&&p.c!=='x'&&p.t!=='k'){ const T=JSON.parse(base); T.phased=i; if(ok(T)) return true; } } }
    if(t==='earth'){ for(let i=0;i<64;i++){ const q=S.board[i]; if(!q || (q.c!=='x' && q.t!=='k')){ const T=JSON.parse(base); T.board[i]={c:'x',t:'rock',under:q||null}; if(ok(T)) return true; } } }

}
function afterCast(){
  const moves=allLegal(S);
  if(!moves.length){
    if(inCheck(S)){
      S.over={winner:other(S.turn),reason:'checkmate'}; log(`Still no escape. ${NAMES[other(S.turn)]} wins.`,true); }
    else { log(`${NAMES[S.turn]} has no move and passes.`); endTurn(); }
  }
}
function doMove(m){
  snapshot();
  if(S.spell&&S.spell.type==='speed'){ streak=pathSquares(m.from,m.to).map((sq,i)=>({sq,d:i*45})); streakT0=Date.now(); clearTimeout(streakT); streakT=setTimeout(()=>{streak=[];render();},900); }

  S.lastMove=[m.from,m.to];
  const gl=GLYPH[p.c][p.t];
  log(`${S.moveNo}${S.turn==='w'?'.':'...'} ${gl} ${sqName(m.from)}${cap?'x':'-'}${sqName(m.to)}${m.castle?' castles':''}${m.promo?'=Q':''}`, true);
  if(S.flipped){ log(`${sqName(m.to)} switches sides.`,true); flipSq=m.to; flipT0=Date.now(); setTimeout(()=>{ if(flipSq===m.to){ flipSq=-1; render(); } },900); }

    S.spell.stage=1; S.speedSq=m.to; S.sel=m.to;
    if(!legal(S,m.to).length){ log('Speed: no second move available.'); endTurn(); }
  } else endTurn();
  render(); commit();
}
function cast(idx){
  if(!canAct()) return;
  const type=S.hands[S.turn][idx];
  if(type==='speed'){ snapshot(); S.hands[S.turn].splice(idx,1); S.discard.push(type); (S.discardBy||(S.discardBy=[])).push(S.turn); S.spell={type,stage:0}; S.casts=(S.casts||0)+1; S.notice=''; S.sel=-1; castFx('speed'); log(`${NAMES[S.turn]} casts Speed.`,true); afterCast(); render(); commit(); const b=document.getElementById('board'); b.style.setProperty('--spell',SPELLS.speed.color); b.classList.add('pulse'); setTimeout(()=>b.classList.remove('pulse'),750); return; }
  S.pending={type,idx}; S.sel=-1; render();
}
function pickTargets(){
  if(!S.pending) return [];
  const t=S.pending.type, out=[];
  for(let i=0;i<64;i++){ const p=S.board[i];
    if(t==='jump' && p && p.c!=='x' && p.t!=='k') out.push(i);
    if(t==='rage' && p && p.c===S.turn && p.t!=='p') out.push(i);
    if(t==='earth' && (!p || (p.c!=='x' && p.t!=='k'))) out.push(i);
    if(t==='parasite' && p && p.c!=='x' && p.t!=='k') out.push(i);
  }
  return out;
}
function resolveTarget(sq){
  snapshot();
  const {type,idx}=S.pending; S.hands[S.turn].splice(idx,1); S.discard.push(type); (S.discardBy||(S.discardBy=[])).push(S.turn); if(!(S.spell&&S.spell.type==='speed')) S.spell={type}; S.casts=(S.casts||0)+1; S.notice=''; S.pending=null; castFx(type); if(type==='earth'){ rockDrop=sq; rockT0=Date.now(); setTimeout(()=>{rockDrop=-1;render();},900); }
  if(type==='jump'){ S.phased=sq; log(`${NAMES[S.turn]} casts Jump on ${sqName(sq)}.`,true); }
  if(type==='rage'){ S.raged=sq; log(`${NAMES[S.turn]} casts Rage on ${sqName(sq)}.`,true); }
  if(type==='parasite'){ (S.infected||(S.infected={}))[sq]={by:S.turn,left:3}; log(`${NAMES[S.turn]} casts Parasite.`,true); }
  if(type==='earth'){ const q=S.board[sq]; S.board[sq]={c:'x',t:'rock',under:q||null}; S.rocks.push({sq,owner:S.turn}); log(`${NAMES[S.turn]} casts Earth on ${sqName(sq)}.`,true); }
  flashSq=sq; flashT0=Date.now(); setTimeout(()=>{ if(flashSq===sq){ flashSq=-1; render(); } },650);
  afterCast(); render(); commit();
}

  const prev=[];
  board.style.setProperty('--dot', S.spell?SPELLS[S.spell.type].color:'rgba(0,0,0,.28)');
  for(let row=0;row<8;row++) for(let col=0;col<8;col++){
    const r=flip?row:7-row, f=flip?7-col:col, sq=r*8+f;
    const d=document.createElement('div'); d.className='sq '+(((r+f)%2)?'lt':'dk');
    if(S.lastMove&&S.lastMove.includes(sq)) d.classList.add('last');
    if(S.sel===sq) d.classList.add('sel');
    if(S.phased===sq) d.classList.add('phased');
    if(S.raged===sq) d.classList.add('raged');
    if(S.speedSq===sq) d.classList.add('speed');
    const sk=streak.find(x=>x.sq===sq); if(sk){ const e=document.createElement('div'); e.className='streak'; e.style.animationDelay=(sk.d-(Date.now()-streakT0))+'ms'; d.appendChild(e); }
    if(targets.includes(sq)){ d.classList.add('cand'); if(sq===hoverSq) d.classList.add('hov'); }
    if(flashSq===sq){ const fr=document.createElement('div'); fr.className='flashring'; fr.style.animationDelay=since(flashT0); d.appendChild(fr); }
    const pv=prev.find(x=>x.to===sq); if(pv){ const o=document.createElement('div'); o.className=pv.cap?'prevcap':'prev'; d.appendChild(o); }
    const infRec=infOf(sq); if(infRec && (infRec.by===view || S.over)){ d.classList.add('infected'); d.style.setProperty('--ph',(-(Date.now()%2400))+'ms'); const dots=document.createElement('div'); dots.className='infdots'; for(let k=0;k<infRec.left;k++){ const o=document.createElement('span'); dots.appendChild(o); } d.appendChild(dots); }
    if(S.pending&&S.pending.type==='parasite'&&sq===hoverSq&&targets.includes(sq)) d.classList.add('infected');
    if(flipSq===sq){ d.classList.add('flipanim'); d.style.setProperty('--t0',since(flipT0)); const fr=document.createElement('div'); fr.className='flashring dark'; fr.style.animationDelay=since(flipT0); d.appendChild(fr); }
    if(S.pending&&S.pending.type==='earth'&&sq===hoverSq&&targets.includes(sq)){ const k=document.createElement('div'); k.className='rock ghost'; k.innerHTML=ROCK_SVG; d.appendChild(k); }
    if(col===0){ const c=document.createElement('span'); c.className='coord r'; c.textContent=r+1; d.appendChild(c); }
    if(row===7){ const c=document.createElement('span'); c.className='coord f'; c.textContent=FILES[f]; d.appendChild(c); }
    const p=S.board[sq];
    if(p){ if(p.c==='x'){ if(p.under){ const s=document.createElement('span'); s.className='pc '+p.under.c+' encased'; s.textContent=GLYPH.b[p.under.t]+'\uFE0E'; d.appendChild(s); } const k=document.createElement('div'); k.className='rock'+(p.under?' encase':'')+(rockDrop===sq?' rise':''); k.innerHTML=ROCK_SVG+(rockDrop===sq?'<i class="dust"></i><i class="dust"></i><i class="dust"></i><i class="dust"></i>':''); if(rockDrop===sq){ k.querySelector('svg').style.animationDelay=since(rockT0); k.querySelectorAll('.dust').forEach(e=>e.style.animationDelay=since(rockT0)); d.classList.add('quake'); d.style.animationDelay=since(rockT0); } d.appendChild(k); }
      else { const s=document.createElement('span'); s.className='pc '+p.c; s.textContent=GLYPH.b[p.t]+'︎'; d.appendChild(s); }
      if(p.c===S.turn && sq!==S.phased && !S.over && !S.pending && (S.speedSq<0||S.speedSq===sq)) d.classList.add('tgt'); }
    const m=legalMoves.find(m=>m.to===sq);
    if(m){ d.classList.add('tgt'); const o=document.createElement('div'); o.className=(S.board[sq]||m.ep)?'ring':'dot'; d.appendChild(o); }
    d.onclick=()=>clickSquare(sq);
    if(S.pending){ d.onmouseenter=()=>{ if(hoverSq!==sq){ hoverSq=sq; render(); } }; }
    board.appendChild(d);
  }
  // status
  const st=document.getElementById('status'), hint=document.getElementById('hint');
  showEnd(); renderClocks(); renderBars();
  if(S.over){ st.innerHTML=S.over.winner?`<span class="who ${S.over.winner}"></span>${NAMES[S.over.winner]} wins by ${S.over.reason}`:'Draw by stalemate'; hint.textContent='New game to play again.'; hint.className='hint'; }
  else {
    if(inMulligan()){ const ms=mullSeat(); st.innerHTML=online?(ms?(S.mull[ms].done?'Waiting for opponent':'Choose your hand'):'Players are choosing hands'):`<span class="who ${ms||'w'}"></span>${NAMES[ms||'w']}: choose your hand`; }
    else st.innerHTML=`<span class="who ${S.turn}"></span>${online?(online.seat?(online.seat===S.turn?'Your move':'Opponent\'s move'):NAMES[S.turn]+' to move'):NAMES[S.turn]+' to move'}${inCheck(S)?' &middot; in check':''}`;
    let h='', warn=false;
    if(inMulligan()){ const ms=mullSeat(); h=(ms&&!S.mull[ms].done)?'Swap one spell for a random one from the deck, or keep your hand.':'Waiting for the other player to choose.'; }
    else if(S.pending){ h={jump:'Jump: pick any piece except a king. Your pieces pass through it, and neighbours can leap over it.',rage:'Rage: pick one of your pieces (not a pawn; king allowed). It moves as a queen this turn.',earth:'Earth: pick any square except a king. A piece there is locked in stone: it cannot move, be captured, or attack.',parasite:'Parasite: pick a piece to infect. Only you will see the mark.'}[S.pending.type]; }
    else if(S.speedSq>=0) h='Speed: move the same piece again (no capture).';
    else if(S.notice){ h=S.notice; warn=true; }
    else if(S.spell) h=`${SPELLS[S.spell.type].name} is active. Now move.`;
    else if(online && online.seats && !(online.seats.w&&online.seats.b)) h='Waiting for an opponent to join with code '+online.code+'.';
    else h='';
    hint.textContent=h; hint.className='hint'+(warn?' warn':'');
  }
  document.getElementById('undo').disabled=(!history.length&&!S.pending)||!!online;
  // hands
  const me=view, op=other(me);
  const spectator=online&&!online.seat;
  document.getElementById('handTitle').textContent=(online&&!spectator)?'Your hand':`${NAMES[me]}'s hand`;
  document.getElementById('handN').textContent=S.hands[me].length;
  const hand=document.getElementById('hand'); hand.innerHTML='';
  const canCast=!S.over && !S.pending && canAct() && !S.spell && S.speedSq<0;
  if(spectator){ const n=document.createElement('div'); n.className='online-note'; n.textContent='Spectating. Hands are hidden.'; hand.appendChild(n); }
  else if(inMulligan()){
    const ms=mullSeat(); const mine=ms===me && !S.mull[me].done;
    S.hands[me].forEach((t,i)=>{ const c=cardEl(t, mine?(S.mullSel===i?'armed':'playable'):'dim'); if(mine) c.onclick=()=>{ S.mullSel=(S.mullSel===i)?-1:i; render(); }; hand.appendChild(c); });
    const row=document.createElement('div'); row.className='online-row'; row.style.width='100%';
    if(mine){
      const bSwap=document.createElement('button'); bSwap.className='primary'; bSwap.textContent=S.mullSel>=0?'Swap selected':'Select a card to swap'; bSwap.disabled=S.mullSel<0; bSwap.onclick=()=>doMulligan(me,S.mullSel);
      const bKeep=document.createElement('button'); bKeep.textContent='Keep hand'; bKeep.onclick=()=>doMulligan(me,-1);
      row.appendChild(bSwap); row.appendChild(bKeep);
    } else { const n=document.createElement('div'); n.className='online-note'; n.textContent=(S.mull[me]&&S.mull[me].done)?'Hand locked in.':''; row.appendChild(n); }
    hand.appendChild(row);
  }
  else S.hands[me].forEach((t,i)=>{ const armed=S.pending&&S.pending.idx===i; const c=cardEl(t, canCast?'playable':(armed?'armed':'dim')); if(canCast) c.onclick=()=>cast(i); if(armed){ c.style.cursor='pointer'; c.onclick=cancelSpell; } hand.appendChild(c); });
  const rev=document.getElementById('revealed'); rev.innerHTML=''; S.revealed.forEach(t=>rev.appendChild(cardEl(t,'sm')));
  document.getElementById('revN').textContent=S.revealed.length;
  const disc=document.getElementById('discard'); disc.innerHTML='';
  { const by=S.discardBy||[]; const mineL=(online&&!spectator)?'Yours':NAMES[me]; const oppL=(online&&!spectator)?'Opponent':NAMES[op];
    const groups=[[me,mineL],[op,oppL]];
    groups.forEach(([who,label])=>{ const g=document.createElement('div'); g.className='discgroup'; const l=document.createElement('div'); l.className='disclabel'; l.textContent=label; g.appendChild(l); const row=document.createElement('div'); row.className='cards'; row.style.minHeight='0';
      S.discard.forEach((t,i)=>{ if((by[i]||null)===who) row.appendChild(cardEl(t,'sm',false)); });
      if(!row.children.length){ const e=document.createElement('div'); e.className='online-note'; e.textContent='none'; row.appendChild(e); }
      g.appendChild(row); disc.appendChild(g); });
  }
  document.getElementById('discN').textContent=S.discard.length;
  // tracker: copies the opponent could still hold = 3 - (my hand + revealed + discard)
  const tr=document.getElementById('track'); tr.innerHTML='';
  document.getElementById('trackTitle').textContent=(online&&!spectator)?'Opponent could hold':`${NAMES[op]} could hold`;
  let total=0;
  for(const t of Object.keys(SPELLS)){
    const known=[...S.hands[me],...S.revealed,...S.discard].filter(x=>x===t).length;
    const left=Math.max(0,3-known); total+=left;
    const st=document.createElement('div'); st.className='stack';
    for(let i=0;i<3;i++){ const c=cardEl(t,'sm'+(i<3-left?' gone':''),false); c.style.top=(i*26)+'px'; c.style.zIndex=i; st.appendChild(c); }
    const n=document.createElement('div'); n.className='cnt'; n.textContent=left; st.appendChild(n);
    tr.appendChild(st);
  }
  document.getElementById('trackN').textContent='';
  document.getElementById('deckN').textContent=S.deck.length;
  const rem=S.revealEvery-((S.moveNo-1)%S.revealEvery); document.getElementById('nextRev').textContent=S.deck.length>3?rem:'—';
}

const tipEl=document.getElementById('tip');
function showTip(el,text){ const r=el.getBoundingClientRect(); tipEl.textContent=text; tipEl.style.left=(r.left+r.width/2)+'px'; tipEl.style.top=r.top+'px'; tipEl.hidden=false; }
function hideTip(){ tipEl.hidden=true; }
document.getElementById('board').onmouseleave=()=>{ if(hoverSq>=0){ hoverSq=-1; render(); } };
document.getElementById('gear').onclick=()=>{ const b=document.getElementById('settingsBlock'); b.hidden=!b.hidden; document.getElementById('onlineBlock').hidden=true; };
document.getElementById('undo').onclick=undo;
document.getElementById('resign').onclick=resign;
document.getElementById('newgame').onclick=()=>{ if(online&&!online.seat) return; newGame(); if(online) commit({bothHands:true}); };
document.getElementById('onlineBtn').onclick=()=>{ const b=document.getElementById('onlineBlock'); b.hidden=!b.hidden; document.getElementById('settingsBlock').hidden=true; };
renderOnline();
document.getElementById('sFlip').onchange=render;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') cancelSpell(); });

function start(data){
  newGame(); initFirebase();
  let saved=null; try{ saved=localStorage.getItem('spellchess_game'); }catch(e){}
  if(saved && fbReady){ fbReady.then(ok=>{ if(ok) joinOnline(saved); }); }
}
window.claude?.hot?.snapshot?.(()=>({S,history}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
